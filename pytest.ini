[pytest]
# Suite por defecto = invariantes de datos + soluciones (rápido, sin navegador):
#   pytest            (equivale a pytest -m "not browser")
# Suite de navegador (landing, tema, barrido de 29 lecciones, Pyodide):
#   pytest -m browser
# Solo el barrido lento (29 lecciones + Pyodide):
#   pytest -m "browser and slow"
# El -m del CLI pisa al de addopts (addopts va primero en la línea de comandos).
addopts = -m "not browser" --browser-channel=msedge
testpaths = tests
markers =
    browser: pruebas de UI que necesitan un navegador (pytest-playwright)
    slow: barridos lentos (Pyodide / 29 lecciones)
